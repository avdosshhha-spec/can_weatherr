  {type:"html", title:"Meet the Alpaca", html:()=>`<div class="reading">
   <p><b>1.</b> Alpacas are animals from <mark>South America</mark>. They live high in the <mark>Andes</mark> Mountains in Peru, Bolivia and Chile. It is very cold there, but alpacas have <mark>thick</mark>, <mark>soft</mark> <mark>fleece</mark>, so they stay warm.</p>
   <p><b>2.</b> Thousands of years ago, people in the Andes started to keep alpacas. They wanted their <mark>wool</mark>. Alpaca wool is very soft and warm. People make hats, scarves and jumpers from it.</p>
   <p><b>3.</b> Alpacas look like <mark>llamas</mark>, but they are <mark>smaller</mark>. A llama is taller and stronger than an alpaca, so people use llamas to <mark>carry</mark> bags in the mountains. Alpacas are more <mark>delicate</mark>. Their ears are short, but llama ears are long and look like bananas!</p>
   <p><b>4.</b> Alpacas are <mark>friendly</mark> and <mark>social</mark> animals. They live in groups called <mark>herds</mark>. They don't like to be <mark>alone</mark>. When an alpaca is happy or worried, it <mark>hums</mark>. And when it is angry… it <mark>spits</mark>!</p></div>`},

function rWyr(t,box){ t.items.forEach(([a,b])=>{ const row=h("div","q-row"); row.append(h("p","q","Would you rather…"));
  const g=h("div","opts"); const p=h("p","hint",""); [a,b].forEach(x=>{ const btn=h("button","opt",x); btn.type="button";
    btn.onclick=()=>{ g.querySelectorAll(".opt").forEach(z=>z.classList.remove("pick")); btn.classList.add("pick"); p.innerHTML=`Скажи: <i>I'd rather ${x} because…</i>`; }; g.append(btn); });
  row.append(g,p); box.append(row); }); }

const TICK=`<svg viewBox="0 0 120 130" class="tick" aria-hidden="true">
 <line x1="30" y1="112" x2="20" y2="126" class="tk-leg"/><line x1="90" y1="112" x2="100" y2="126" class="tk-leg"/>
 <circle cx="28" cy="22" r="14" class="tk-bell"/><circle cx="92" cy="22" r="14" class="tk-bell"/>
 <circle cx="60" cy="68" r="50" class="tk-body"/><circle cx="60" cy="68" r="40" class="tk-face"/>
 <circle cx="46" cy="58" r="6" class="tk-eye"/><circle cx="74" cy="58" r="6" class="tk-eye"/>
 <circle cx="48" cy="56" r="2" fill="#fff"/><circle cx="76" cy="56" r="2" fill="#fff"/>
 <path d="M44 80 Q60 94 76 80" class="tk-mouth"/>
 <line x1="60" y1="68" x2="60" y2="38" class="tk-hand"/><line x1="60" y1="68" x2="80" y2="74" class="tk-hand"/>
 <circle cx="36" cy="76" r="5" class="tk-cheek"/><circle cx="84" cy="76" r="5" class="tk-cheek"/></svg>`;

let stars=0, totalStars=0; const stageGot={}, stageTot={};
const app=$("#app");
app.innerHTML=`<header class="top"><div><p class="eyebrow">Video lesson · In the Mountains · 60 минут</p><h1>Meet the<br><span>Alpaca!</span></h1>
 <p class="lead">Урок по видео про альпак: новые слова, два просмотра с паузами, текст и разговор. Только мышкой!</p></div>
 <div class="star-box"><b id="stars">0</b><span>/ <i id="tstars">0</i> ★</span></div></header>
 <nav id="tabs"></nav><main id="main"></main>
 <p class="tutor">Для репетитора: план пауз во вкладке «Watch #2», вопросы туриста для ролевой игры во вкладке Let's Talk!</p>`;
const tabs=$("#tabs"), main=$("#main"); const views={};

function star(stage,btn){ stars++; stageGot[stage]=(stageGot[stage]||0)+1; $("#stars").textContent=stars;
  burst(btn); if(stageGot[stage]===stageTot[stage]) done(stage); }
function burst(el){ if(matchMedia("(prefers-reduced-motion: reduce)").matches) return; const r=el.getBoundingClientRect();
  for(let i=0;i<6;i++){ const s=h("span","spark","★"); s.style.left=(r.left+r.width/2)+"px"; s.style.top=(r.top+r.height/2)+"px";
    s.style.setProperty("--dx",(Math.cos(i)*50)+"px"); s.style.setProperty("--dy",(Math.sin(i*1.7)*40-30)+"px"); document.body.append(s); setTimeout(()=>s.remove(),700); } }
function done(stage){ const v=views[stage]; tabs.querySelector(`[data-id="${stage}"]`).classList.add("done");
  const b=h("div","win",`<div class="medal">★</div><div><b>Stage complete!</b><span>Ты молодец! Переходи к следующему этапу.</span></div>`); v.append(b); }
const say=(sid,txt)=>{ const s=views[sid]&&views[sid].querySelector(".bubble .say"); if(s){ s.innerHTML=txt; } };
const PRAISE=["Great!","Super!","Well done!","Yes!","Cool!","Brilliant!","Perfect!"];

function rChoice(t,box,sid){
  t.items.forEach(it=>{ totalStars++; stageTot[sid]=(stageTot[sid]||0)+1;
    const row=h("div","q-row"+(t.story?" story":"")); row.append(h("p","q",it.q.replace(/___/g,'<span class="gap">?</span>')));
    const g=h("div","opts");
    shuffle(it.o.map((o,j)=>[o,j])).forEach(([o,j])=>{ const b=h("button","opt",o); b.type="button";
      b.onclick=()=>{ if(j===it.a){ b.classList.add("ok"); g.querySelectorAll("button").forEach(x=>x.disabled=true);
          const parts=o.split(" … "); row.querySelectorAll(".gap").forEach((gp,i)=>{ gp.textContent=parts[i]||parts[0]; gp.classList.add("filled"); });
          star(sid,b); say(sid,PRAISE[Math.floor(Math.random()*PRAISE.length)]); }
        else { b.classList.add("no"); b.disabled=true; say(sid,"Oops! Try again!"); } };
      g.append(b); });
    row.append(g); box.append(row); });
}
function rOrder(t,box,sid){ totalStars++; stageTot[sid]=(stageTot[sid]||0)+1;
  const pool=h("div","pool"), ans=h("div","answer"), msg=h("p","msg","");
  const mk=w=>{ const b=h("button","word",w); b.type="button"; b.onclick=()=>{ if(box.classList.contains("solved")) return; (b.parentNode===pool?ans:pool).append(b); check(); }; return b; };
  const check=()=>{ if(pool.children.length) { msg.textContent=""; return; }
    const ok=[...ans.children].map(x=>x.textContent).join(" ")===t.words.join(" ");
    if(ok){ box.classList.add("solved"); ans.classList.add("ok"); msg.textContent="Perfect question!"; star(sid,ans); }
    else { ans.classList.add("bad"); msg.textContent="Not yet! Нажми на слово, чтобы вернуть его."; setTimeout(()=>ans.classList.remove("bad"),600); } };
  shuffle(t.words).forEach(w=>pool.append(mk(w)));
  box.append(pool,ans,msg);
}
function rTalk(t,box){ t.items.forEach(it=>{ const row=h("div","talk"); row.append(h("p","q",it.q));
  const b=h("button","peek","Show an idea"); b.type="button"; const m=h("div","idea",it.m); m.hidden=true;
  b.onclick=()=>{ m.hidden=!m.hidden; b.textContent=m.hidden?"Show an idea":"Hide"; }; row.append(b,m); box.append(row); }); }

STAGES.forEach((s,si)=>{
  const b=h("button","tab "+s.color,`<small>${si+1} · ${s.min} min</small>${s.title}`); b.type="button"; b.dataset.id=s.id;
  b.onclick=()=>show(s.id,true); tabs.append(b);
  const v=h("section","stage "+s.color); v.hidden=true; views[s.id]=v;
  v.append(h("div","sticky",`<span class="sticky-tag">Правило</span><div class="rule">${s.tick}</div>`));
  s.tasks.forEach((t,ti)=>{ const box=h("section","card");
    box.append(h("h3",null,`<b>${String.fromCharCode(65+ti)}</b>${t.title}`)); if(t.hint) box.append(h("p","hint",t.hint));
    if(t.type==="wyr") rWyr(t,box); else if(t.type==="choice") rChoice(t,box,s.id); else if(t.type==="order") rOrder(t,box,s.id); else if(t.type==="talk") rTalk(t,box); else box.insertAdjacentHTML("beforeend",t.html());
    v.append(box); });
  main.append(v);
});
$("#tstars").textContent=totalStars;
function show(id,scroll){ Object.entries(views).forEach(([k,v])=>v.hidden=k!==id); tabs.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.id===id)); if(scroll) main.scrollIntoView({block:"start",behavior:"smooth"}); }
let st=location.hash.slice(1); show(views[st]?st:"words",false);

</script>
</body>
</html>
