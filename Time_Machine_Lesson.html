<style>
/* Layout: stage tabs with chunky tap targets */

}

:root[data-theme="dark"]{--bg:#14162B;--card:#1E2140;--ink:#ECEBFF;--muted:#A9ABD3;--line:#30345C;--soft:#262A4F;--ok:#4BD898;--ok-bg:#173A2C;--no:#FF7B7F;--no-bg:#3D1F25;color-scheme:dark}
*{box-sizing:border-box}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}

.tk-eye{fill:#22224A}.tk-mouth{fill:none;stroke:#22224A;stroke-width:4;stroke-linecap:round}.tk-hand{stroke:#22224A;stroke-width:4;stroke-linecap:round}.tk-cheek{fill:#FFB3C7}

@media (max-width:520px){.tick{width:66px}.say{font-size:1.1rem}}

.gap{display:inline-block;min-width:3em;text-align:center;border-bottom:3px solid var(--c);color:var(--c);padding:0 4px}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:700 1rem var(--body);color:var(--ink);background:var(--card);border:2.5px solid var(--line);border-radius:14px;padding:8px 16px;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .1s}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateY(-2px)}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.no{background:var(--no-bg);border-color:var(--no);color:var(--no);text-decoration:line-through;box-shadow:none}
.opt:disabled{cursor:default}.opt:disabled:not(.ok):not(.no){opacity:.5}

 @keyframes pop{50%{transform:scale(1.12)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}}

.fstage{display:grid;gap:12px}

.fcard .f{background:var(--card);border:3px solid var(--c);box-shadow:0 6px 0 var(--c)}
.fcard .bk{background:var(--c);color:#fff;transform:rotateY(180deg)}
.fcard.flip .f{transform:rotateY(180deg)}.fcard.flip .bk{transform:rotateY(360deg)}
.fcard small{font:800 .75rem var(--body);letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.fcard b{font:700 clamp(1.9rem,8vw,2.7rem)/1.1 var(--display)}
.fcard em{font-size:.85rem;color:var(--muted);font-style:normal}
@media (prefers-reduced-motion:reduce){.fcard .face{transition:none}}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fbtns .opt{text-align:center;font-size:1.05rem}
.no-b{color:var(--no)!important;border-color:var(--no)!important}.yes-b{color:var(--ok)!important;border-color:var(--ok)!important}
.fend{background:var(--soft);border-radius:18px;padding:14px 16px;display:grid;gap:8px}.fend>b{font:700 2.4rem var(--display);color:var(--c)}.fend p{margin:0;font-weight:700}
.opt.pick{background:color-mix(in srgb,var(--c) 18%,var(--card));border-color:var(--c)}

.fcard .tr{font:700 1.1rem var(--body);opacity:.9}
.vtable{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin-top:10px}
.vtable div{display:grid;grid-template-columns:auto auto;gap:0 8px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 10px}
.vtable b{font:700 1.05rem var(--display)}.vtable span{font-weight:800;color:var(--c)}.vtable i{grid-column:1/-1;font-style:normal;color:var(--muted);font-size:.85rem}

.vfab{position:fixed;z-index:30;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font:700 1.1rem var(--display);color:#fff;background:var(--orange);border:0;border-radius:20px;padding:10px 18px;box-shadow:0 5px 0 #C9601A;cursor:pointer;display:grid;line-height:1.05}
.vfab small{font:800 .7rem var(--body);opacity:.9}
.vov{position:fixed;inset:0;z-index:40;background:rgba(20,22,43,.45);display:grid;align-items:end;justify-items:center;padding:16px}
.vpanel{--c:var(--orange);width:100%;max-width:760px;max-height:82vh;overflow:auto;background:var(--bg);border-radius:24px;border:3px solid var(--orange);padding:14px 16px 18px}
.vhead{display:flex;justify-content:space-between;align-items:center}.vhead b{font:700 1.5rem var(--display);color:var(--orange)}
.vclose{font:800 1.1rem var(--body);width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.vletters{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.vletters button{font:800 .95rem var(--body);min-width:36px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.vletters button.on{background:var(--orange);border-color:var(--orange);color:#fff}

function rTransform(t,box,sid){
  const wrap=h("div","tx"); const picker=h("div","picker"); picker.hidden=true;
  const parts=t.text.split(/(\{[^}]+\})/);
  let tokens=[];
  parts.forEach(p=>{ if(p.startsWith("{")){ const f=p.slice(1,-1).split("|"); const orig=f[0], ans=f[1]==="="?orig:f[1];
      const opts=f[1]==="="?["✓ OK",...f.slice(2)]:f.slice(1); const correct=f[1]==="="?"✓ OK":f[1];
      const b=h("button","tok",orig); b.type="button"; b.dataset.ans=ans; totalStars++; stageTot[sid]=(stageTot[sid]||0)+1;
      const tok={b,orig,ans,opts,correct,done:false}; tokens.push(tok);
      b.onclick=()=>open(tok); wrap.append(b); }
    else wrap.append(document.createTextNode(p)); });
  let cur=null;
  function open(tok){ if(tok.done) return; tokens.forEach(x=>x.b.classList.remove("cur")); tok.b.classList.add("cur"); cur=tok;
    picker.hidden=false; picker.innerHTML=""; picker.append(h("span","pk-l",`<b>${tok.orig}</b> →`));
    shuffle(tok.opts).forEach(o=>{ const ob=h("button","opt",o); ob.type="button";
      ob.onclick=()=>{ if(o===tok.correct){ tok.done=true; tok.b.textContent=tok.ans; tok.b.classList.remove("cur"); tok.b.classList.add("done"); if(tok.ans===tok.orig) tok.b.classList.add("kept");
          star(sid,tok.b); picker.hidden=true; const nx=tokens.find(x=>!x.done); if(nx) open(nx); else finish(); }
        else { ob.classList.add("no"); ob.disabled=true; } };
      picker.append(ob); }); }
  function finish(){ const m=h("div","txdone",`<b>Готово!</b> Теперь прочитай весь текст вслух.`); box.append(m); }
  box.append(wrap,picker);
}

function burst(el){ if(matchMedia("(prefers-reduced-motion: reduce)").matches) return; const r=el.getBoundingClientRect();
  for(let i=0;i<6;i++){ const s=h("span","spark","★"); s.style.left=(r.left+r.width/2)+"px"; s.style.top=(r.top+r.height/2)+"px";
    s.style.setProperty("--dx",(Math.cos(i)*50)+"px"); s.style.setProperty("--dy",(Math.sin(i*1.7)*40-30)+"px"); document.body.append(s); setTimeout(()=>s.remove(),700); } }
function done(stage){ const v=views[stage]; tabs.querySelector(`[data-id="${stage}"]`).classList.add("done");
  const b=h("div","win",`<div class="medal">★</div><div><b>Stage complete!</b><span>Ты молодец! Переходи к следующему этапу.</span></div>`); v.append(b); }
const say=(sid,txt)=>{ const s=views[sid]&&views[sid].querySelector(".bubble .say"); if(s){ s.innerHTML=txt; } };
const PRAISE=["Great!","Super!","Well done!","Yes!","Cool!","Brilliant!","Perfect!"];

function rChoice(t,box,sid){
  t.items.forEach(it=>{ totalStars++; stageTot[sid]=(stageTot[sid]||0)+1;
    const row=h("div","q-row"+(t.story?" story":"")); row.append(h("p","q",it.q.replace(/___/g,'<span class="gap">?</span>')));
    const g=h("div","opts");
    shuffle(it.o.map((o,j)=>[o,j])).forEach(([o,j])=>{ const b=h("button","opt",o); b.type="button";
      b.onclick=()=>{ if(j===it.a){ b.classList.add("ok"); g.querySelectorAll("button").forEach(x=>x.disabled=true);
          const parts=o.split(" … "); row.querySelectorAll(".gap").forEach((gp,i)=>{ gp.textContent=parts[i]||parts[0]; gp.classList.add("filled"); });
          star(sid,b); say(sid,PRAISE[Math.floor(Math.random()*PRAISE.length)]); }
        else { b.classList.add("no"); b.disabled=true; say(sid,"Oops! Try again!"); } };
      g.append(b); });
    row.append(g); box.append(row); });
}
function rOrder(t,box,sid){ totalStars++; stageTot[sid]=(stageTot[sid]||0)+1;
  const pool=h("div","pool"), ans=h("div","answer"), msg=h("p","msg","");
  const mk=w=>{ const b=h("button","word",w); b.type="button"; b.onclick=()=>{ if(box.classList.contains("solved")) return; (b.parentNode===pool?ans:pool).append(b); check(); }; return b; };
  const check=()=>{ if(pool.children.length) { msg.textContent=""; return; }
    const ok=[...ans.children].map(x=>x.textContent).join(" ")===t.words.join(" ");
    if(ok){ box.classList.add("solved"); ans.classList.add("ok"); msg.textContent="Perfect question!"; star(sid,ans); }
    else { ans.classList.add("bad"); msg.textContent="Not yet! Нажми на слово, чтобы вернуть его."; setTimeout(()=>ans.classList.remove("bad"),600); } };
  shuffle(t.words).forEach(w=>pool.append(mk(w)));
  box.append(pool,ans,msg);
}
function rTalk(t,box){ t.items.forEach(it=>{ const row=h("div","talk"); row.append(h("p","q",it.q));
  const b=h("button","peek","Show an idea"); b.type="button"; const m=h("div","idea",it.m); m.hidden=true;
  b.onclick=()=>{ m.hidden=!m.hidden; b.textContent=m.hidden?"Show an idea":"Hide"; }; row.append(b,m); box.append(row); }); }

STAGES.forEach((s,si)=>{
  const b=h("button","tab "+s.color,`<small>${si+1} · ${s.min} min</small>${s.title}`); b.type="button"; b.dataset.id=s.id;
  b.onclick=()=>show(s.id,true); tabs.append(b);
  const v=h("section","stage "+s.color); v.hidden=true; views[s.id]=v;
  v.append(h("div","sticky",`<span class="sticky-tag">Правило</span><div class="rule">${s.tick}</div>`));
  s.tasks.forEach((t,ti)=>{ const box=h("section","card");
    box.append(h("h3",null,`<b>${String.fromCharCode(65+ti)}</b>${t.title}`)); if(t.hint) box.append(h("p","hint",t.hint));
    if(t.type==="wyr") rWyr(t,box); else if(t.type==="flash") rFlash(t,box); else if(t.type==="transform") rTransform(t,box,s.id); else if(t.type==="choice") rChoice(t,box,s.id); else if(t.type==="order") rOrder(t,box,s.id); else if(t.type==="talk") rTalk(t,box); else box.insertAdjacentHTML("beforeend",t.html());
    v.append(box); });
  main.append(v);
});
$("#tstars").textContent=totalStars;
function show(id,scroll){ Object.entries(views).forEach(([k,v])=>v.hidden=k!==id); tabs.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.id===id)); if(scroll) main.scrollIntoView({block:"start",behavior:"smooth"}); }
let st=location.hash.slice(1); show(views[st]?st:"flip",false);

verbHelper();
</script>
</body>
</html>
